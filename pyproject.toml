[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zoe-intelligence-engine"
version = "0.1.0"
description = "Zoe Intelligence Engine"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
    "psutil>=6.0.0",
    "cryptography>=43.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

